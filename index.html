<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kawaii Chord Maker</title>
  <meta name="description" content="Create beautiful chord sheets easily. A cute chord chart maker app for musicians." />
  <link rel="icon" href="images/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --pink:   #FF8FAB;
      --mint:   #A8E6CF;
      --yellow: #FFD97D;
      --purple: #3D1F4E;
      --dark:   #2A1538;
      --light:  #FFF6FB;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--light);
      color: var(--purple);
      overflow-x: hidden;
    }

    /* ── LANG TOGGLE ── */
    .lang-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 100;
      display: flex;
      background: rgba(255,255,255,.15);
      backdrop-filter: blur(8px);
      border-radius: 999px;
      border: 1.5px solid rgba(255,255,255,.3);
      overflow: hidden;
    }

    .lang-toggle button {
      padding: 7px 16px;
      font-family: inherit;
      font-size: .85rem;
      font-weight: 700;
      border: none;
      background: transparent;
      color: rgba(255,255,255,.6);
      cursor: pointer;
      transition: background .2s, color .2s;
    }

    .lang-toggle button.active {
      background: var(--pink);
      color: var(--purple);
      border-radius: 999px;
    }

    /* ── HERO ── */
    .hero {
      background: linear-gradient(135deg, var(--dark) 0%, #5C2D6E 100%);
      color: white;
      text-align: center;
      padding: 80px 24px 100px;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 15% 30%, rgba(255,143,171,.25) 0%, transparent 50%),
        radial-gradient(circle at 85% 70%, rgba(168,230,207,.2) 0%, transparent 50%);
    }

    .hero-inner { position: relative; max-width: 760px; margin: 0 auto; }

    .hero img.logo {
      width: 180px;
      margin-bottom: 28px;
      filter: drop-shadow(0 4px 16px rgba(0,0,0,.4));
    }

    .hero h1 {
      font-size: clamp(2rem, 6vw, 3.4rem);
      font-weight: 900;
      line-height: 1.15;
      margin-bottom: 20px;
    }

    .hero h1 span.pink   { color: var(--pink); }
    .hero h1 span.mint   { color: var(--mint); }
    .hero h1 span.yellow { color: var(--yellow); }

    .hero p {
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      opacity: .88;
      line-height: 1.7;
      margin-bottom: 40px;
    }

    .btn-group { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }

    .btn {
      display: inline-block;
      padding: 14px 36px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
    }
    .btn:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,.25); }

    .btn-primary  { background: var(--pink); color: var(--purple); }
    .btn-secondary {
      background: transparent;
      border: 2px solid rgba(255,255,255,.5);
      color: white;
    }

    .notes {
      position: absolute;
      font-size: 2rem;
      opacity: .15;
      animation: float 6s ease-in-out infinite;
      pointer-events: none;
    }
    .notes:nth-child(1) { top: 10%; left:  8%; animation-delay: 0s; }
    .notes:nth-child(2) { top: 20%; right: 10%; animation-delay: 1.5s; }
    .notes:nth-child(3) { bottom: 20%; left: 12%; animation-delay: 3s; }
    .notes:nth-child(4) { bottom: 15%; right: 6%; animation-delay: 4.5s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-8deg); }
      50%       { transform: translateY(-16px) rotate(8deg); }
    }

    /* ── SCREENSHOT ── */
    .screenshot-section {
      background: var(--purple);
      padding: 64px 24px;
      text-align: center;
    }

    .screenshot-section img {
      max-width: 900px;
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }

    /* ── FEATURES ── */
    .features {
      padding: 80px 24px;
      max-width: 1000px;
      margin: 0 auto;
      text-align: center;
    }

    .section-title {
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      font-weight: 900;
      margin-bottom: 12px;
    }
    .section-title .accent { color: var(--pink); }

    .section-sub {
      font-size: 1rem;
      opacity: .7;
      margin-bottom: 52px;
    }

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 28px;
    }

    .feature-card {
      background: white;
      border-radius: 20px;
      padding: 36px 28px;
      box-shadow: 0 4px 20px rgba(61,31,78,.08);
      transition: transform .2s, box-shadow .2s;
    }
    .feature-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 32px rgba(61,31,78,.14);
    }

    .feature-icon { font-size: 2.6rem; margin-bottom: 16px; display: block; }
    .feature-card h3 { font-size: 1.1rem; font-weight: 800; margin-bottom: 10px; }
    .feature-card p  { font-size: .93rem; line-height: 1.65; opacity: .72; }

    .feature-card:nth-child(1) { border-top: 4px solid var(--pink); }
    .feature-card:nth-child(2) { border-top: 4px solid var(--mint); }
    .feature-card:nth-child(3) { border-top: 4px solid var(--yellow); }
    .feature-card:nth-child(4) { border-top: 4px solid var(--pink); }
    .feature-card:nth-child(5) { border-top: 4px solid var(--mint); }
    .feature-card:nth-child(6) { border-top: 4px solid var(--yellow); }

    /* ── HOW IT WORKS ── */
    .how {
      background: linear-gradient(135deg, #FFF0F6 0%, #F0FFF8 100%);
      padding: 80px 24px;
      text-align: center;
    }

    .steps {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      max-width: 860px;
      margin: 0 auto;
    }

    .step { flex: 1; min-width: 200px; padding: 24px 20px; }

    .step-num {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--pink);
      color: white;
      font-size: 1.4rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }
    .step:nth-child(2) .step-num { background: var(--mint);   color: var(--purple); }
    .step:nth-child(3) .step-num { background: var(--yellow); color: var(--purple); }

    .step h3 { font-size: 1rem; font-weight: 800; margin-bottom: 8px; }
    .step p  { font-size: .9rem; opacity: .7; line-height: 1.6; }

    /* ── CTA ── */
    .cta {
      background: linear-gradient(135deg, var(--dark) 0%, #5C2D6E 100%);
      color: white;
      text-align: center;
      padding: 80px 24px;
    }
    .cta h2 { font-size: clamp(1.6rem, 4vw, 2.4rem); font-weight: 900; margin-bottom: 16px; }
    .cta p  { opacity: .8; margin-bottom: 36px; font-size: 1.05rem; }

    /* ── FOOTER ── */
    footer {
      background: var(--dark);
      color: rgba(255,255,255,.5);
      text-align: center;
      padding: 24px;
      font-size: .85rem;
    }

    @media (max-width: 600px) {
      .hero { padding: 60px 20px 80px; }
      .hero img.logo { width: 130px; }
    }
  </style>
</head>
<body>

  <!-- LANG TOGGLE -->
  <div class="lang-toggle">
    <button id="btn-ja" onclick="setLang('ja')">JP</button>
    <button id="btn-en" onclick="setLang('en')">EN</button>
  </div>

  <!-- HERO -->
  <section class="hero">

    <span class="notes">&#9834;</span>
    <span class="notes">&#9833;</span>
    <span class="notes">&#9835;</span>

    <div class="hero-inner">
      <img class="logo" src="images/icon.png" alt="Kawaii Chord Maker logo" />

      <h1>
        <span class="pink">KAW</span><span class="mint">Aii</span><br />
        <span class="yellow">CHORD</span> <span class="pink">MAKER</span>

      <p data-i18n="hero.sub"></p>

      <div class="btn-group">
        <a href="#download" class="btn btn-primary" data-i18n="hero.download"></a>
        <a href="#features" class="btn btn-secondary" data-i18n="hero.features"></a>
      </div>
    </div>
  </section>

  <!-- SCREENSHOT -->
  <section class="screenshot-section">
    <img src="images/screenshot.png" alt="Kawaii Chord Maker screenshot" />
  </section>

  <!-- FEATURES -->
  <section class="features" id="features">

    <div class="feature-grid">
      <div class="feature-card">
        <span class="feature-icon">🎵</span>
        <h3 data-i18n="features.f1.title"></h3>
        <p  data-i18n="features.f1.body"></p>
      </div>
      <div class="feature-card">
        <span class="feature-icon">📄</span>
        <h3 data-i18n="features.f2.title"></h3>
        <p  data-i18n="features.f2.body"></p>
      </div>
      <div class="feature-card">
        <span class="feature-icon">🎹</span>
        <h3 data-i18n="features.f3.title"></h3>
        <p  data-i18n="features.f3.body"></p>
      </div>
      <div class="feature-card">
        <span class="feature-icon">🔀</span>
        <h3 data-i18n="features.f4.title"></h3>
        <p  data-i18n="features.f4.body"></p>
      </div>
      <div class="feature-card">
        <span class="feature-icon">🎨</span>
        <h3 data-i18n="features.f5.title"></h3>
        <p  data-i18n="features.f5.body"></p>
      </div>
      <div class="feature-card">
        <span class="feature-icon">⚙️</span>
        <h3 data-i18n="features.f6.title"></h3>
        <p  data-i18n="features.f6.body"></p>
      </div>
    </div>
  </section>

  <!-- HOW IT WORKS -->
  <section class="how">
    <h2 class="section-title" style="margin-bottom:12px" data-i18n="how.title"></h2>
    <p class="section-sub" data-i18n="how.sub"></p>

    <div class="steps">
      <div class="step">
        <div class="step-num">1</div>
        <h3 data-i18n="how.s1.title"></h3>
        <p  data-i18n="how.s1.body"></p>
      </div>
      <div class="step">
        <div class="step-num">2</div>
        <h3 data-i18n="how.s2.title"></h3>
        <p  data-i18n="how.s2.body"></p>
      </div>
      <div class="step">
        <div class="step-num">3</div>
        <h3 data-i18n="how.s3.title"></h3>
        <p  data-i18n="how.s3.body"></p>
      </div>
    </div>
  </section>

  <!-- CTA / DOWNLOAD -->
  <section class="cta" id="download">
    <h2 data-i18n="cta.title"></h2>
    <p  data-i18n="cta.sub"></p>
    <div class="btn-group">
      <a href="https://d3d58j90eq33d6.cloudfront.net/releases/v1.1.0/KawaiiChordMaker_Setup_1.1.0.exe" class="btn btn-primary" data-i18n="cta.download"></a>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <p>&copy; 2026 Kawaii Chord Maker &nbsp;|&nbsp; Made with &#10084;</p>
  </footer>

  <script>
    const i18n = {
      ja: {
        "hero.sub":      "歌詞にコードを乗せて、<br>きれいなコード譜をかんたんに作れるアプリです。",

        "features.f1.body":  "歌詞の各フレーズにコードタグを付けてまとめて管理。編集もかんたんです。",
        "features.f2.title": "リアルタイムプレビュー",
        "features.f2.body":  "入力しながらコード譜の仕上がりを右パネルで確認できます。",
        "features.f3.title": "コードビルダー内蔵",

        "features.f4.title": "トランスポーズ＆ランダマイズ",
        "features.f4.body":  "ワンクリックで移調。コード進行のインスピレーションにはランダマイズ機能を。",
        "features.f5.title": "マイパレット",
        "features.f5.body":  "よく使うコードをパレットに保存しておけば、次回からもっとスムーズに。",
        "features.f6.title": "レイアウト自由自在",
        "features.f6.body":  "フォントサイズ・余白・行間・2カラム表示など、印刷に合わせて細かく調整できます。",

        "how.title": "使い方 <span class='accent'>3ステップ</span>",
        "how.sub":   "はじめてでもすぐに使えます",
        "how.s1.title": "歌詞を入力",
        "how.s1.body":  "1行ずつ歌詞のフレーズを入力して追加します。",
        "how.s2.title": "コードを付ける",
        "how.s2.body":  "コードビルダーでコードを選んで、歌詞の上に配置します。",
        "how.s3.title": "保存 & 印刷",
        "how.s3.body":  "ファイルに保存したり、きれいなコード譜として出力できます。",

        "cta.title":    "さっそく使ってみよう &#9835;",
        "cta.sub":      "無料でダウンロードできます。Windows対応。",
        "cta.download": "Windows版をダウンロード",
      },
      en: {
        "hero.sub":      "Add chords to your lyrics and create beautiful chord charts — easily.",
        "hero.download": "Download (Free)",
        "hero.features": "See Features",

        "features.title": "What You Can Do <span class='accent'>♡</span>",
        "features.sub":   "A cute and easy-to-use chord chart maker for musicians",
        "features.f1.title": "Manage Lyrics & Chords Together",
        "features.f1.body":  "Attach chord tags to each lyric phrase and manage them all in one place.",
        "features.f2.title": "Real-Time Preview",
        "features.f2.body":  "See your chord chart take shape instantly in the preview panel as you type.",
        "features.f3.title": "Built-in Chord Builder",
        "features.f3.body":  "Pick a root note and chord type to quickly add any chord you need.",
        "features.f4.title": "Transpose & Randomize",
        "features.f4.body":  "Transpose with one click. Use Randomize to spark new chord progression ideas.",
        "features.f5.title": "My Palette",
        "features.f5.body":  "Save your favourite chords to your palette for faster access next time.",
        "features.f6.title": "Flexible Layout",
        "features.f6.body":  "Fine-tune font size, margins, line gap, and 2-column view for the perfect printout.",

        "how.title": "How It Works — <span class='accent'>3 Steps</span>",
        "how.sub":   "Anyone can get started right away",
        "how.s1.title": "Enter Your Lyrics",
        "how.s1.body":  "Type each lyric phrase line by line and add them to the editor.",
        "how.s2.title": "Add Chords",
        "how.s2.body":  "Choose chords from the chord builder and place them above the lyrics.",
        "how.s3.title": "Save & Print",
        "how.s3.body":  "Save your file or export a clean chord chart ready to print.",

        "cta.title":    "Start Making Chord Charts &#9835;",
        "cta.sub":      "Free to download. Available on Windows.",
        "cta.download": "Download for Windows",
      }
    };

    function setLang(lang) {
      document.documentElement.lang = lang;
      localStorage.setItem('kcm-lang', lang);

      document.getElementById('btn-ja').classList.toggle('active', lang === 'ja');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (i18n[lang][key] !== undefined) {
          el.innerHTML = i18n[lang][key];
        }
      });
    }

    // Auto-detect on load
    const saved = localStorage.getItem('kcm-lang');
    const browser = navigator.language || navigator.userLanguage || '';
    const lang = saved || (browser.startsWith('ja') ? 'ja' : 'en');
    setLang(lang);
  </script>

</body>
</html>
